<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>國小國語圈詞練習</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">國小國語</p>
      <h1>圈詞朗讀與測驗</h1>
    </div>
    <label class="lesson-picker">
      <span>課別</span>
      <select id="lessonSelect"></select>
    </label>
  </header>

  <main class="layout">
    <section class="study-panel" aria-labelledby="lessonTitle">
      <div class="title-row">
        <div>
          <p id="lessonMeta" class="muted"></p>
          <h2 id="lessonTitle"></h2>
        </div>
        <button id="speakAllBtn" class="primary" type="button">朗讀全部</button>
      </div>

      <div id="wordList" class="word-list"></div>

      <details class="manager">
        <summary>管理圈詞</summary>
        <form id="wordForm" class="word-form">
          <input id="wordInput" type="text" autocomplete="off" placeholder="輸入圈詞">
          <input id="editIndexInput" type="hidden">
          <button id="saveWordBtn" class="primary" type="submit">新增</button>
          <button id="cancelEditBtn" type="button" hidden>取消</button>
        </form>
        <div id="manageList" class="manage-list"></div>
        <div class="manager-actions">
          <button id="recognizeCurrentBtn" type="button">辨識目前圖片並加入候選詞</button>
          <button id="resetWordsBtn" type="button">還原本課預設圈詞</button>
        </div>
        <textarea id="ocrText" class="ocr-text" readonly placeholder="辨識結果會顯示在這裡"></textarea>
      </details>

      <details class="lesson-manager">
        <summary>課別資料 / 上傳圖片</summary>
        <form id="currentLessonForm" class="lesson-form">
          <label>
            <span>目前課別名稱</span>
            <input id="lessonTitleInput" type="text" required>
          </label>
          <label>
            <span>目前年級</span>
            <input id="lessonGradeInput" type="text" required>
          </label>
          <label class="wide">
            <span>替換目前課本圖片</span>
            <input id="lessonImagesInput" type="file" accept="image/*" multiple>
          </label>
          <div class="lesson-form-actions wide">
            <button class="primary" type="submit">儲存目前課別</button>
            <button id="deleteLessonBtn" type="button">刪除目前課別</button>
          </div>
        </form>
        <hr class="soft-divider">
        <form id="lessonForm" class="lesson-form">
          <label>
            <span>課別名稱</span>
            <input id="newLessonTitleInput" type="text" placeholder="第2課 課名" required>
          </label>
          <label>
            <span>年級</span>
            <input id="newLessonGradeInput" type="text" value="2年級" required>
          </label>
          <label class="wide">
            <span>課本圖片</span>
            <input id="newLessonImagesInput" type="file" accept="image/*" multiple required>
          </label>
          <div class="lesson-form-actions wide">
            <button id="createLessonBtn" class="primary" type="submit">新增課別</button>
            <button id="createLessonOcrBtn" type="button">新增並辨識圈詞</button>
          </div>
        </form>
        <p id="lessonStatus" class="progress" aria-live="polite"></p>
      </details>

      <div class="book-images" id="bookImages"></div>
    </section>

    <section class="quiz-panel" aria-labelledby="quizTitle">
      <div class="dictation-box" aria-labelledby="dictationTitle">
        <div>
          <p class="muted">聽語音，把生詞寫在紙上</p>
          <h2 id="dictationTitle">聽寫練習</h2>
        </div>
        <div id="dictationList" class="dictation-list"></div>
        <div class="dictation-settings">
          <label>
            <span>順序</span>
            <select id="dictationSequenceSelect">
              <option value="order">照順序</option>
              <option value="random">亂序</option>
            </select>
          </label>
          <label>
            <span>方式</span>
            <select id="dictationPlayModeSelect">
              <option value="manual">手動</option>
              <option value="auto">自動</option>
            </select>
          </label>

          <label>
            <span>自動間隔秒數</span>
            <input id="dictationDelayInput" type="number" min="1" max="30" step="1" value="3">
          </label>
        </div>
        <div class="dictation-actions">
          <button id="startDictationBtn" class="primary" type="button">開始唸</button>
          <button id="repeatDictationBtn" type="button" disabled>重唸目前</button>
          <button id="nextDictationBtn" type="button" disabled>下一個</button>
          <button id="stopDictationBtn" type="button">停止</button>
        </div>
        <p id="dictationStatus" class="progress" aria-live="polite"></p>
      </div>

      <div class="title-row compact">
        <div>
          <p class="muted">聽語音，選出正確圈詞</p>
          <h2 id="quizTitle">測驗</h2>
        </div>
        <button id="speakCurrentBtn" class="icon-button" type="button" aria-label="再聽一次">🔊</button>
      </div>

      <div class="mode-row" role="group" aria-label="測驗模式">
        <button id="orderModeBtn" class="mode active" type="button">課本順序</button>
        <button id="randomModeBtn" class="mode" type="button">跳著考</button>
      </div>

      <div class="quiz-card">
        <p id="progressText" class="progress"></p>
        <div id="questionWord" class="question-word">按「開始測驗」</div>
        <div id="choices" class="choices"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
      </div>

      <div class="actions">
        <button id="startBtn" class="primary" type="button">開始測驗</button>
        <button id="nextBtn" type="button" disabled>下一題</button>
      </div>

      <div class="score-box">
        <span>答對</span>
        <strong id="correctCount">0</strong>
        <span>題，共</span>
        <strong id="totalCount">0</strong>
        <span>題</span>
      </div>
    </section>
  </main>

  <script src="lessons.js?v=20260908-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js?v=20260908-1"></script>
</body>
</html>
